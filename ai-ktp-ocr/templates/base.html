<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}VeriKTP AI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <!-- Decorative blurred gradient blobs — the "glass" in glassmorphism needs
         something colorful behind it to actually read as glass. -->
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <nav class="navbar">
      <a href="/" class="brand">VeriKTP AI</a>
      <div class="nav-links">
        <a href="/" class="{{ 'active' if active_page == 'home' else '' }}"
          >Upload & Verifikasi</a
        >
        <a
          href="/history"
          class="{{ 'active' if active_page == 'history' else '' }}"
          >Database History</a
        >
      </div>
    </nav>

    <div class="container">{% block content %}{% endblock %}</div>

    <footer class="footer">
      Developed by
      <a
        href="https://github.com/nadiraaini77"
        target="_blank"
        rel="noopener noreferrer"
      >
        @nadiraaini77
      </a>
    </footer>

    {% block scripts %}{% endblock %}
  </body>
</html>
